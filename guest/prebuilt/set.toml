# The kexts an x86-64 macOS guest's OpenCore image injects for the reims-graphics
# device: one [[kext]] per Kernel > Add entry, in order, after Lilu's, each the bundle
# beside this file named by BundlePath. Written by `make -C guest prebuilt`; do not edit.
# The keys are OpenCore's, but sha256, the SHA-256 of the entry's executable.
format = 1
MinKernel = "25.4.0"
MaxKernel = "25.99.99"

[[kext]]
BundlePath = "ReimsGraphicsLoader.kext"
ExecutablePath = "Contents/MacOS/ReimsGraphicsLoader"
PlistPath = "Contents/Info.plist"
Arch = "x86_64"
MinKernel = "25.4.0"
MaxKernel = "25.99.99"
Comment = "Binds ReimsGraphics to IOGraphicsFamily and AppleGraphicsDeviceControl"
sha256 = "79e29d81c9af4484f9786e8edd3bd91243c7fdcddc33dc64c868c6b56a846ea8"

[[kext]]
BundlePath = "RgfxIOGraphicsFamilyBridge.kext"
ExecutablePath = "Contents/MacOS/RgfxIOGraphicsFamilyBridge"
PlistPath = "Contents/Info.plist"
Arch = "x86_64"
MinKernel = "25.4.0"
MaxKernel = "25.99.99"
Comment = "IOGraphicsFamily placeholders ReimsGraphics links against"
sha256 = "347b0d81deeb1aba5a6bb2640c9f69bce68607b88b3d7fc5b7f43687ce365253"

[[kext]]
BundlePath = "RgfxAppleGraphicsDeviceControlBridge.kext"
ExecutablePath = "Contents/MacOS/RgfxAppleGraphicsDeviceControlBridge"
PlistPath = "Contents/Info.plist"
Arch = "x86_64"
MinKernel = "25.4.0"
MaxKernel = "25.99.99"
Comment = "AppleGraphicsDeviceControl placeholders ReimsGraphics links against"
sha256 = "12bded4c6d70f1177662195121927ca9ce0af450a80f3fcf79ba1b555887f95d"

[[kext]]
BundlePath = "ReimsGraphics.kext"
ExecutablePath = "Contents/MacOS/ReimsGraphics"
PlistPath = "Contents/Info.plist"
Arch = "x86_64"
MinKernel = "25.4.0"
MaxKernel = "25.99.99"
Comment = "The reims-graphics display, accelerator and device control"
sha256 = "51a8e74e76aa6da29276474a2793bff7e33ae70e3f8d4e280dc5d79d5c17087a"

[[kext]]
BundlePath = "RgfxGate.kext"
ExecutablePath = "Contents/MacOS/RgfxGate"
PlistPath = "Contents/Info.plist"
Arch = "x86_64"
MinKernel = "25.4.0"
MaxKernel = "25.99.99"
Comment = "Installs the reims-graphics Metal bundle and lets macOS load it"
sha256 = "c9c15022f3e16db5cc6fac98a928fdf252b7532c626d951ec1ea0a7396881b34"
