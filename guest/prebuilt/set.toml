# The kexts an x86-64 macOS guest's OpenCore image injects for the reims-graphics
# device: one [[kext]] per Kernel > Add entry, in order, each the bundle
# beside this file named by BundlePath. Written by `make -C guest prebuilt`; do not edit.
# The keys are OpenCore's, but sha256, the SHA-256 of the entry's executable.
format = 1
MinKernel = "20.0.0"
MaxKernel = ""

[[kext]]
BundlePath = "Graft.kext"
ExecutablePath = "Contents/MacOS/Graft"
PlistPath = "Contents/Info.plist"
Arch = "x86_64"
MinKernel = "20.0.0"
MaxKernel = ""
Comment = "Binds and routes the owned guest kexts"
sha256 = "0a29c2d26219d87941104bd4aef3de836fedcc6824d831bb5de8f8993b16898e"

[[kext]]
BundlePath = "ReimsGraphics.kext"
ExecutablePath = "Contents/MacOS/ReimsGraphics"
PlistPath = "Contents/Info.plist"
Arch = "x86_64"
MinKernel = "20.0.0"
MaxKernel = ""
Comment = "The reims-graphics display, accelerator and device control"
sha256 = "fc4862c9b2100ce6ee51cc7d79ecd4486fd8534a05c5aa368872282d367986e3"

[[kext]]
BundlePath = "RgfxGate.kext"
ExecutablePath = "Contents/MacOS/RgfxGate"
PlistPath = "Contents/Info.plist"
Arch = "x86_64"
MinKernel = "20.0.0"
MaxKernel = ""
Comment = "Installs the reims-graphics Metal bundle and admits it"
sha256 = "c7175075d853e341e1871825c346b70fcd6384b49499ea4ba63143ad742d525a"
