# The kexts an arm64 macOS guest's Ambrosia config places for the reims-graphics
# device: one [[kext]] per Kernel > Add entry, in order, each the bundle
# beside this file named by BundlePath. Written by `make -C guest prebuilt-arm64e`; do not edit.
# The keys are OpenCore's, but sha256, the SHA-256 of the entry's executable.
format = 1
MinKernel = "22.0.0"
MaxKernel = ""

[[kext]]
BundlePath = "ReimsGraphics.kext"
ExecutablePath = "Contents/MacOS/ReimsGraphics"
PlistPath = "Contents/Info.plist"
Arch = "arm64e"
MinKernel = "22.0.0"
MaxKernel = ""
Comment = "The reims-graphics display and accelerator"
sha256 = "0b34379dc1aa8eaf252752da4c498e92deea9a16a59022636eb4c48bf8fd0c01"

[[kext]]
BundlePath = "RgfxGate.kext"
ExecutablePath = "Contents/MacOS/RgfxGate"
PlistPath = "Contents/Info.plist"
Arch = "arm64e"
MinKernel = "22.0.0"
MaxKernel = ""
Comment = "Installs the reims-graphics Metal bundle and admits it"
sha256 = "1ec06358f87316727be0761be1d0af253de4cffb414fbee6b9f77712eb12276e"
