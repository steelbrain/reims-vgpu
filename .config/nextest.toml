# How cargo-nextest schedules the workspace's tests, `cargo xtask check`'s among them.
#
# A Mac's GPU is shared by every process on it. The test that holds the most of its memory runs
# first, with nothing else in flight; the longest tests start next, so the run does not end on one
# that began late. Why, and what such tests did to the others before, is in docs/lessons.md
# ("Tools and worktrees", and "The platform and the runtime" for Metal's compiles). Every override but the last four is the Mac's alone; on
# Linux only the last four apply, and nextest runs the other tests in its own order. A filter that
# names a package or binary the workspace no longer has fails every nextest run, so a rename
# updates this file too.

# A reservation of 2^31 - 1 resource IDs, opt-in (`#[ignore]`), run only for a change to what it
# tests, with `--run-ignored only`: 16 GiB of memory for about a second, six times any other
# test's peak, where others' command buffers fail with "Insufficient Memory" when the GPU's memory
# runs out.
[[profile.default.overrides]]
platform = 'cfg(target_os = "macos")'
filter = 'binary_id(reims-vgpu-vulkan) & test(=gpu::icb::tests::metal_tests::a_reservation_of_2_31_minus_1_is_metals)'
threads-required = "num-test-threads"
priority = 100

# Metal's compute state of a fragment function crashes Metal's compiler service 4 times, 200
# crashes a run, and now and then one of these synchronous compiles never returns. The test
# makes Metal's answers in a child it kills and starts again after a minute, up to 3 times;
# nextest ends the test at 5 minutes should that hang too. It starts early, so that a child
# started again runs beside the rest.
[[profile.default.overrides]]
platform = 'cfg(target_os = "macos")'
filter = 'binary_id(reims-vgpu-vulkan) & test(=gpu::resource::tests::metal_tests::compute_state_answers_are_metals_for_every_kernel_here)'
priority = 50
slow-timeout = { period = "60s", terminate-after = 5 }

# The tests that take 15 s or more under the check's load, which start right after the ones
# that run alone.
[[profile.default.overrides]]
platform = 'cfg(target_os = "macos")'
filter = '''
    (binary_id(reims-vgpu-vulkan) & (
        test(/extended_range_.*blends/)
      | test(/^gpu::ycbcr::sampling::.*_samples_as_metals$/)
      | test(=gpu::encode_render::tests::metal_tests::resolves_into_other_formats_are_metals_or_die_named)
      | test(=gpu::encode_render::tests::metal_tests::indexed_strips_restart_at_the_set_index_as_metals_do)
      | test(=gpu::rgbx::nan_clears_are_metals)
      | test(=gpu::fill::tests::metal_tests::colors_are_metals)))
'''
priority = 50

# The keep-awake's exit test, on every platform with the long tests: it runs 8 child processes
# that each make a device and exit amid the keep-awake's touches. Alone the 8 took 7.4 s on msi's
# RTX 5080; in the Vulkan crate's whole run there, beside the other test processes making their
# devices, each took about 26 s, 211 s in all (measured 2026-11-05), so it starts early rather
# than end the run.
[[profile.default.overrides]]
filter = 'binary_id(reims-vgpu-vulkan) & test(=awake::tests::an_exit_amid_touches_ends_with_its_status)'
priority = 50

# The `vaapi` module's tests of the GPU held (`vaapi::va::spin`, `va::wait::gpu`, `va::wait::held`),
# opt-in (`#[ignore]`) and run on the VA-API host with `--run-ignored only`, each alone. Each
# holds the GPU's ring with a spin of its own and times the display's calls against it, so a
# test made beside another's spin waits for that spin too: run together (nextest's default), a
# test of the held graphics ring failed 1 of 1 on the Radeon 780M, then passed 6 of 6 alone (jobs
# m3-max-4299, m3-max-4303, 2026-11-07).
[[profile.default.overrides]]
platform = 'cfg(target_os = "linux")'
filter = 'binary_id(reims-vgpu-video) & test(/^vaapi::va::(spin|wait::(gpu|held))::/)'
threads-required = "num-test-threads"

# A device cache's planes over its exported memory: where the device's verdict for that memory
# did not pass (a record of its driver's check, or this process's check), the test checks that
# the planes lie on the device's lines alone, and says so; its output shows on a pass too, so a
# run shows a pass that skipped the check of the planes in place.
[[profile.default.overrides]]
platform = 'cfg(target_os = "linux")'
filter = 'binary_id(reims-vgpu-vulkan) & test(=gpu::resource::tests::a_device_cache_lays_its_planes_on_the_devices_lines_from_its_first_planes_byte)'
success-output = "final"

# The measurements whose `#[ignore]` says they hold the GPU or run alone, on every platform:
# opt-in, taken only by a run of ignored tests (`--run-ignored all` or `only`), and then run with
# nothing else in flight, in whatever filter takes them. One beside other GPU tests fails theirs:
# on an RTX 3090 (driver 620.70.06) under `--profile nvidia --run-ignored all`, the tests of
# `graphics::nvidia::`, `video_host::` and `surface_cache::`, which take surface_cache's download
# costs, failed 3 of 4 runs, and `graphics::nvidia::` beside the download costs alone 1 of 4, each
# failure an NVDEC decode whose status was 8 (cuvidDecodeStatus_Error); the same filters without
# the download costs failed none of 8 (m3-max-53602, m3-max-53622, 2026-11-19).
[[profile.default.overrides]]
filter = '''
    (binary_id(reims-vgpu) & (
        test(=graphics::decode::surface_cache::costs::download_costs_vulkan)
      | test(=graphics::decode::surface_pages::costs::surface_view_costs_vulkan)
      | test(=graphics::decode::surface_pages::costs::pages_take_costs_vulkan)
      | test(=graphics::decode::surface_pages::costs::large_take_costs_vulkan)
      | test(=graphics::decode::icb_slots_cost::on_vulkan_icb_slots_cost)
      | test(=graphics::decode::handler_cost::on_vulkan_handler_cost)
      | test(=graphics::decode::close_cost::on_vulkan_close_cost)
      | test(=graphics::decode::composite_cost::on_vulkan_composite_cost)
      | test(=graphics::decode::composite_cost::on_rt_composite_cost)
      | test(=graphics::decode::dispatch_cost::on_vulkan_dispatch_cost)
      | test(=graphics::decode::dispatch_cost::on_rt_dispatch_cost)
      | test(=graphics::decode::draw_cost::on_vulkan_draw_cost)))
  | (binary_id(reims-vgpu-vulkan) & (
        test(=os::linux::host_ram::tests::slab_heap_costs)
      | test(=os::linux::host_ram::tests::slab_nocopy_costs)))
'''
threads-required = "num-test-threads"

# The NVIDIA hosts' legs (`--profile nvidia`, AGENTS.md "The video crates' checks"): at most three
# tests that make a Vulkan device at a time, the keep-awake's exit test, whose 8 children each
# make one, taking all three. Each test process makes a device of its own, up to 16 at once where
# a QEMU makes one, and NVIDIA's driver holds what each live device takes. On an RTX 2080 behind a
# Thunderbolt 3 link, whose BAR1 is 256 MiB (no Resizable BAR), each device maps 67 MiB of it
# (metal2vulkan's first 64 MiB block of write-combined memory), and a `vkCreateDevice` made while
# the live ones leave too little is refused with VK_ERROR_INITIALIZATION_FAILED (NVRM:
# "dmaAllocMapping_GM107: can't alloc VA space for mapping"); its channel heap holds 160 to 190
# queues' channels too, a device taking 17 of them (NVRM: "Instance block allocation ... failed").
# Measured 2026-11-11, driver 620.70.06: 6 test processes at once passed and 8 failed 4 to 6 of
# them; a whole leg at 16 test threads failed 20 tests, a different 20 each run, each passing
# alone (m3-max-15516, m3-max-15566, m3-max-15797, m3-max-15798). The driver makes the devices
# of every process one at a time (about 0.45 s each for one of 16 queues), so the bound costs
# the leg little.
[test-groups]
vulkan-devices = { max-threads = 3 }

# The measurements that run alone (above, the same list) stay out of the group, so that what they
# wait for is every test in flight rather than the group's three.
[[profile.nvidia.overrides]]
platform = 'cfg(target_os = "linux")'
filter = '''
    (binary_id(reims-vgpu) & (
        test(=graphics::decode::surface_cache::costs::download_costs_vulkan)
      | test(=graphics::decode::surface_pages::costs::surface_view_costs_vulkan)
      | test(=graphics::decode::surface_pages::costs::pages_take_costs_vulkan)
      | test(=graphics::decode::surface_pages::costs::large_take_costs_vulkan)
      | test(=graphics::decode::icb_slots_cost::on_vulkan_icb_slots_cost)
      | test(=graphics::decode::handler_cost::on_vulkan_handler_cost)
      | test(=graphics::decode::close_cost::on_vulkan_close_cost)
      | test(=graphics::decode::composite_cost::on_vulkan_composite_cost)
      | test(=graphics::decode::composite_cost::on_rt_composite_cost)
      | test(=graphics::decode::dispatch_cost::on_vulkan_dispatch_cost)
      | test(=graphics::decode::dispatch_cost::on_rt_dispatch_cost)
      | test(=graphics::decode::draw_cost::on_vulkan_draw_cost)))
  | (binary_id(reims-vgpu-vulkan) & (
        test(=os::linux::host_ram::tests::slab_heap_costs)
      | test(=os::linux::host_ram::tests::slab_nocopy_costs)))
'''
test-group = "@global"

[[profile.nvidia.overrides]]
platform = 'cfg(target_os = "linux")'
filter = 'binary_id(reims-vgpu-vulkan) & test(=awake::tests::an_exit_amid_touches_ends_with_its_status)'
test-group = "vulkan-devices"
threads-required = 3

[[profile.nvidia.overrides]]
platform = 'cfg(target_os = "linux")'
filter = '''
    (package(reims-vgpu-vulkan) & !(binary_id(reims-vgpu-vulkan) & test(/^core::/)))
  | (package(reims-vgpu) & test(/on_vulkan/))
  | package(reims-vgpu-c)
'''
test-group = "vulkan-devices"
