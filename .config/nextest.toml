# How cargo-nextest schedules the workspace's tests, `cargo xtask check`'s among them.
#
# Each override names its platform or applies on every platform, and nextest runs the other tests
# in its own order. A filter that names a package or binary the workspace no longer has fails every
# nextest run, so a rename updates this file too.

# The `vaapi` module's tests of the GPU held (`vaapi::va::spin`, `va::wait::gpu`, `va::wait::held`),
# opt-in (`#[ignore]`) and run on the VA-API host with `--run-ignored only`, each alone. Each
# holds the GPU's ring with a spin of its own and times the display's calls against it, so a
# test made beside another's spin waits for that spin too: run together (nextest's default), a
# test of the held graphics ring failed 1 of 1 on the Radeon 780M, then passed 6 of 6 alone (jobs
# m3-max-4299, m3-max-4303, 2026-11-07).
[[profile.default.overrides]]
platform = 'cfg(target_os = "linux")'
filter = 'binary_id(reims-vgpu-video) & test(/^vaapi::va::(spin|wait::(gpu|held))::/)'
threads-required = "num-test-threads"

# The measurements whose `#[ignore]` says they hold the GPU or run alone, on every platform:
# opt-in, taken only by a run of ignored tests (`--run-ignored all` or `only`), and then run with
# nothing else in flight, in whatever filter takes them. One beside other GPU tests fails theirs:
# on an RTX 3090 (driver 620.70.06) under `--profile nvidia --run-ignored all`, the tests of
# `graphics::nvidia::`, `video_host::` and `surface_cache::`, which take surface_cache's download
# costs, failed 3 of 4 runs, and `graphics::nvidia::` beside the download costs alone 1 of 4, each
# failure an NVDEC decode whose status was 8 (cuvidDecodeStatus_Error); the same filters without
# the download costs failed none of 8 (m3-max-53602, m3-max-53622, 2026-11-19). The NVENC
# in-place check's test counts its GPU's encoder sessions, which the tests beside it hold too:
# run with the NVIDIA tests, it counted 3 (m3-max-77594, 2026-11-27).
[[profile.default.overrides]]
filter = '''
    (binary_id(reims-vgpu) & (
        test(=graphics::decode::surface_cache::costs::download_costs_vulkan)
      | test(=graphics::decode::surface_pages::costs::surface_view_costs_vulkan)
      | test(=graphics::decode::surface_pages::costs::pages_take_costs_vulkan)
      | test(=graphics::decode::surface_pages::costs::large_take_costs_vulkan)
      | test(=graphics::decode::handler_cost::on_vulkan_handler_cost)
      | test(=graphics::decode::close_cost::on_vulkan_close_cost)
      | test(=graphics::decode::composite_cost::on_rt_composite_cost)
      | test(=graphics::decode::dispatch_cost::on_rt_dispatch_cost)
      | test(=graphics::decode::draw_cost::on_rt_draw_cost)
      | test(=graphics::nvidia::encode::tests::the_in_place_check_leaves_no_nvenc_session)))
'''
threads-required = "num-test-threads"

# The NVIDIA hosts' legs (`--profile nvidia`, AGENTS.md "The video crates' checks"): at most three
# tests that make a Vulkan device at a time. Each test process makes a device of its own, up to 16 at once where
# a QEMU makes one, and NVIDIA's driver holds what each live device takes. On an RTX 2080 behind a
# Thunderbolt 3 link, whose BAR1 is 256 MiB (no Resizable BAR), each device maps 67 MiB of it
# (metal2vulkan's first 64 MiB block of write-combined memory), and a `vkCreateDevice` made while
# the live ones leave too little is refused with VK_ERROR_INITIALIZATION_FAILED (NVRM:
# "dmaAllocMapping_GM107: can't alloc VA space for mapping"); its channel heap holds 160 to 190
# queues' channels too, a device taking 17 of them (NVRM: "Instance block allocation ... failed").
# Measured 2026-11-11, driver 620.70.06: 6 test processes at once passed and 8 failed 4 to 6 of
# them; a whole leg at 16 test threads failed 20 tests, a different 20 each run, each passing
# alone (m3-max-15516, m3-max-15566, m3-max-15797, m3-max-15798). The driver makes the devices
# of every process one at a time (about 0.45 s each for one of 16 queues), so the bound costs
# the leg little.
[test-groups]
vulkan-devices = { max-threads = 3 }

# The measurements that run alone (above, the same list) stay out of the group, so that what they
# wait for is every test in flight rather than the group's three.
[[profile.nvidia.overrides]]
platform = 'cfg(target_os = "linux")'
filter = '''
    (binary_id(reims-vgpu) & (
        test(=graphics::decode::surface_cache::costs::download_costs_vulkan)
      | test(=graphics::decode::surface_pages::costs::surface_view_costs_vulkan)
      | test(=graphics::decode::surface_pages::costs::pages_take_costs_vulkan)
      | test(=graphics::decode::surface_pages::costs::large_take_costs_vulkan)
      | test(=graphics::decode::handler_cost::on_vulkan_handler_cost)
      | test(=graphics::decode::close_cost::on_vulkan_close_cost)
      | test(=graphics::decode::composite_cost::on_rt_composite_cost)
      | test(=graphics::decode::dispatch_cost::on_rt_dispatch_cost)
      | test(=graphics::decode::draw_cost::on_rt_draw_cost)
      | test(=graphics::nvidia::encode::tests::the_in_place_check_leaves_no_nvenc_session)))
'''
test-group = "@global"

[[profile.nvidia.overrides]]
platform = 'cfg(target_os = "linux")'
filter = '''
    (package(reims-vgpu-vulkan) & !(binary_id(reims-vgpu-vulkan) & test(/^core::/)))
  | (package(reims-vgpu) & test(/on_vulkan/))
  | package(reims-vgpu-c)
'''
test-group = "vulkan-devices"
