[package]
name = "reims-vgpu-video-vaapi"
description = "The VA-API backend: codecs on the host's GPU through libva, and nothing above it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
reims-vgpu-video-codec = { path = "../reims-vgpu-video-codec" }

# The runtime, locks and waits the libva binding runs on, and its log, which are Linux's alone.
[target.'cfg(target_os = "linux")'.dependencies]
log = "0.4"
reims-vgpu-video-core = { path = "../reims-vgpu-video-core" }

[dev-dependencies]
# The examples' stream readers and writers, and their frame hashes.
reims-vgpu-video-conformance = { path = "../reims-vgpu-video-conformance" }

# The tests of the bounded waits hold the GPU with a compute shader of their own, on Vulkan
# (`src/va/spin.rs`).
[target.'cfg(target_os = "linux")'.dev-dependencies]
ash.workspace = true

