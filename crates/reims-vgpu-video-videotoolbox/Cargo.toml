[package]
name = "reims-vgpu-video-videotoolbox"
description = "The VideoToolbox backend: codecs and pixel transfers on a macOS host, and nothing above VideoToolbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
log = "0.4"
reims-vgpu-video-core = { path = "../reims-vgpu-video-core" }

# The codecs above the hardware, which only the macOS backend reads.
[target.'cfg(target_os = "macos")'.dependencies]
reims-vgpu-video-codec = { path = "../reims-vgpu-video-codec" }

[dev-dependencies]
# The suite every backend runs, and its stream readers.
reims-vgpu-video-conformance = { path = "../reims-vgpu-video-conformance" }

# The conformance suite on this backend, named for it: the three backends' examples share one
# target directory, where examples of one name overwrite each other.
[[example]]
name = "videotoolbox-conformance"
path = "examples/conformance.rs"
