# cbindgen configuration for include/reims_graphics_wire.h, the device's wire format, which the
# guest's kext and option ROM include. `cargo xtask header` regenerates it; `--check` fails on
# drift. The header holds `wire` alone: the host side's public items are not C's.
language = "C"
include_guard = "REIMS_GRAPHICS_WIRE_H"
autogen_warning = "/* Generated by cbindgen from crates/reims-graphics (cbindgen.toml): `cargo xtask header`.\n * Committed and drift-checked by `cargo xtask header --check`. Do not edit by hand. */"
style = "type"
documentation = true
documentation_style = "c99"
cpp_compat = true
sys_includes = ["stdint.h"]
no_includes = true
header = """/*
 * reims_graphics_wire.h: the wire format of the reims-graphics device (PCI 1234:5247), which the
 * guest's kext and option ROM share with the host (crates/reims-graphics/src/wire.rs, and
 * docs/graphics-kext/design.md, "Stage 2 wire protocol").
 *
 * Every value is little-endian. A message's struct is the whole message, its header included.
 * Each ring field sits in a 64-byte line of its own. The guest maps BAR 2 write-back.
 */"""

[parse]
parse_deps = false

[export]
prefix = ""
item_types = ["constants", "structs"]
# The host side's constants, which the guest reads from the registers instead.
exclude = ["REGION_SIZE"]
# The records, which no function names, listed so that cbindgen writes them.
include = [
    "RgfxRingHeader",
    "RgfxMsgHeader",
    "RgfxGetDisplays",
    "RgfxSetScanout",
    "RgfxSetCursor",
    "RgfxMoveCursor",
    "RgfxSetVblank",
    "RgfxComplete",
    "RgfxDisplays",
    "RgfxDisplayEntry",
    "RgfxModeEntry",
    "RgfxDisplayChanged",
    "RgfxVblank",
    "RgfxObjectDestroy",
    "RgfxObjectCreate",
    "RgfxSharedEventCreate",
    "RgfxQueueCreate",
    "RgfxHeapCreate",
    "RgfxHeapOverHostMemory",
    "RgfxBufferCreate",
    "RgfxBufferOverHostMemory",
    "RgfxBufferAtOffset",
    "RgfxCbComplete",
    "RgfxEventSignalled",
]

[struct]
derive_eq = false
