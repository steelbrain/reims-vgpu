[package]
name = "reims-vgpu-vulkan"
description = "The library's platform: core, what the graphics device and its platform share, and the Platform implementation over metal2vulkan-runtime, on Vulkan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# core::testkit and testkit::capture outside this crate's own unit tests (architecture 13.2).
testkit = []

[dependencies]
# core (`core`): its locks (`core::sync`), and the guest's physical ranges as bytes (`core::host`).
parking_lot.workspace = true
zerocopy.workspace = true
# metal2vulkan's Metal types, for the enums and descriptor values the runtime's calls take.
metal2vulkan.workspace = true
# The library's runtime (`rt_platform`, `RtPlatform`), and our side of its seam (`seam`).
metal2vulkan-runtime.workspace = true
# The debug lines that time the runtime's compiles (gpu/timing.rs), through core's logger.
log.workspace = true
# The call recorder's blob hashes (`recorder::format`), SHA-256 as the replay format names them.
sha2.workspace = true
# A display window's swapchain (`swapchain.rs`) and the window system's extensions
# (`os/wsi.rs`), through ash, on Linux, Windows and macOS.
ash.workspace = true

# On macOS the OS services are this crate's own (`os/macos.rs`): threads, clocks, Mach VM, the
# autorelease pool, IOSurface through Foundation, and the message layer of those sends; with
# Metal's system default device, whose registryID the runtime's default device answers
# (os/macos.rs's default_registry_id). objc2's `exception` is on (the workspace's).
[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation.workspace = true
objc2-metal.workspace = true
mach2.workspace = true
libc.workspace = true

# On Linux the OS services are this crate's own (`os/linux.rs`): threads, clocks, the views of
# guest pages over the memory map's files, and IOSurface's stand-in.
[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

# On Windows the OS services are this crate's own (`os/windows.rs`): threads, clocks, and the
# views of guest pages over pagefile-backed sections, with the exception handler that holds a
# thread across a view's remap, the user's local application data folder (the shell's), and a
# compile helper's Job Object and private commit (`os/compile_helper/windows.rs`).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_JobObjects",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
] }

# The hashes of the metallibs' sources, which a metallib built elsewhere is checked by (build.rs).
[build-dependencies]
sha2.workspace = true

[dev-dependencies]
# core's testkit for the integration tests (`tests/`), which link the library as other
# crates do.
reims-vgpu-vulkan = { path = ".", features = ["testkit"] }

[lints]
workspace = true
