[package]
name = "reims-vgpu-core"
description = "What the graphics device and its platform share, generic over the platform; links no Apple framework"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# core::testkit and testkit::capture outside this crate's own unit tests (architecture 13.2).
testkit = ["dep:lzma-rs"]

# Architecture 2.2: no objc2, block2, dispatch2, mach2 or libc here.
[dependencies]
parking_lot.workspace = true
zerocopy.workspace = true
log.workspace = true
# testkit::metal_answers: the recorded answers too long for text, in xz files.
lzma-rs = { workspace = true, optional = true }

[dev-dependencies]
lzma-rs.workspace = true

[lints]
workspace = true
