[package]
name = "reims-vgpu-video-vulkan"
description = "Video decode and encode on Vulkan Video: H.264 and H.265, into outputs and from sources the caller supplies, on a device it may not own"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Vulkan Video, at the workspace's version: the loader opened at run time.
ash.workspace = true
log = "0.4"
reims-vgpu-video-codec = { path = "../reims-vgpu-video-codec" }
reims-vgpu-video-core = { path = "../reims-vgpu-video-core" }

[dev-dependencies]
# The conformance suite's stream readers and MD5, for the framemd5 example.
reims-vgpu-video-conformance = { path = "../reims-vgpu-video-conformance" }

# Named for the backend: the backends' examples share one target directory, where examples of one
# name overwrite each other.
[[example]]
name = "vulkan-h264-framemd5"
path = "examples/vulkan-h264-framemd5.rs"

[[example]]
name = "vulkan-h265-framemd5"
path = "examples/vulkan-h265-framemd5.rs"

[[example]]
name = "vulkan-encode"
path = "examples/vulkan-encode.rs"
