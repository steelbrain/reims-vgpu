[package]
name = "reims-vgpu-video-codec"
description = "The codecs' syntax and decoding and encoding processes above the hardware, for every backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# The encoders' session half (`encode::session`) is core's BackendEncoder.
reims-vgpu-video-core = { path = "../reims-vgpu-video-core" }
# The Annex B start-code scan (`h264::nal`), a vectorized substring search.
memchr.workspace = true

[dev-dependencies]
# Core's fuzzers' harness, which the tests include (`fuzz_support`), bounds each
# input by its CPU time, which `clock_gettime` reads.
libc.workspace = true
