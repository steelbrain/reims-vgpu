[package]
name = "reims-vgpu"
description = "The public Rust API of the reims virtual GPU"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = ["macos-sdl"]
# SDL3's window on macOS, the window crate's `macos-sdl`, which `REIMS_VGPU_WINDOW_IMPL=sdl` opens
# in place of AppKit's. Without it the macOS library has no SDL, and its windows are AppKit's.
# Linux's window is SDL3's whatever this says.
macos-sdl = ["reims-vgpu-window/macos-sdl"]
# Tests: the core objects behind the public handles (`core()`), and core's testkit.
testkit = ["reims-vgpu-core/testkit"]
# Kept for the builds that name it (`--features vulkan`): the Vulkan platform is the library's only
# one, everywhere, so the feature changes nothing.
vulkan = []

[dependencies]
reims-vgpu-core.workspace = true
reims-vgpu-window.workspace = true
# The reims-graphics device's host video: its runtime, which the video arms run on (`video`), and
# on Linux the arms' VA-API and NVDEC (`graphics::vaapi`, `graphics::nvidia`).
reims-vgpu-video.workspace = true
# The reims-graphics device's host side (`graphics`).
reims-graphics.workspace = true
# Reads the reims-graphics device's wire messages into their records (`graphics::decode`).
zerocopy.workspace = true
# A library's content key, by which the reims-graphics device keeps the libraries it made
# (`graphics::decode::library`).
sha2.workspace = true
# A window frame that fails, or a window that gets no sink (`graphics::sink`).
log.workspace = true
# The reims-graphics decoder's lock, which a doorbell's thread takes and its queue's service thread
# lets go (`graphics`'s take on a doorbell): `arc_lock`'s owned guard, and `send_guard`, which lets
# it cross threads.
parking_lot = { workspace = true, features = ["arc_lock", "send_guard"] }
# The host's page size, which the window's import of the scanout's pages is aligned to
# (`graphics::sink`); on Linux, the guest's RAM as a host maps it in the tests (`platform::tests`).
libc.workspace = true

# The Vulkan platform (architecture 2.2), the library's only one: natively on Linux, and over
# MoltenVK on macOS, a build for development and tests.
reims-vgpu-vulkan.workspace = true
metal2vulkan-runtime.workspace = true

# The window's drawable on macOS, a `CAMetalLayer`'s, which the Vulkan sink presents into
# (`graphics::vulkan`'s macOS side); `entry`'s tests read retain counts with `objc2`.
[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-metal.workspace = true
objc2-quartz-core = { workspace = true, features = ["CAMetalLayer", "objc2-metal"] }

[dev-dependencies]
reims-vgpu-core = { workspace = true, features = ["testkit"] }

# The decoder's tests of Metal's own stitched functions (`graphics::decode`).
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-foundation.workspace = true

[lints]
workspace = true
