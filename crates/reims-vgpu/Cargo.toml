[package]
name = "reims-vgpu"
version = "0.1.0"
edition = "2021"
description = "Reims vGPU composition staticlib: device orchestration, QEMU C ABI, and executor adapters"
license = "GPL-2.0-or-later"

[lints.rust]
# objc 0.2's macros retain this legacy feature probe in the destination crate.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[lib]
crate-type = ["staticlib", "rlib"]
name = "reims_vgpu"

[features]
default = []
# Host-owned presentation window (kb host-window): Rust winit window +
# VkSurfaceKHR/swapchain that replaces QEMU's UI. Off by default so the QEMU
# staticlib link is unchanged until the window is proven. Pulls the windowing
# stack; needs the Vulkan engine for the swapchain.
host-window = [
    "dep:winit",
    "dep:ash-window",
    "dep:raw-window-handle",
    "reims-vgpu-vulkan/host-window",
]

[dependencies]
once_cell = "1"
parking_lot = "0.12"
# Wire-format views inferred from macOS Oracles.
# `no_std`, no allocation, no build script — it adds no runtime dependency.
reims-vgpu-wire = { path = "../reims-vgpu-wire" }
# Semantic object kinds and typed protocol identities. Numeric wire tags are
# consumed here before runtime state or backend execution sees an object.
reims-vgpu-protocol = { path = "../reims-vgpu-protocol" }
# Backend-independent task namespaces, resource/storage/mapping graph, and
# lifecycle transitions.
reims-vgpu-core = { path = "../reims-vgpu-core" }
reims-vgpu-config = { path = "../reims-vgpu-config" }
reims-vgpu-memory = { path = "../reims-vgpu-memory" }
reims-vgpu-observe = { path = "../reims-vgpu-observe" }
# Vulkan capability classification, topology policy, native execution, and
# device-scoped GPU sessions.
reims-vgpu-vulkan = { path = "../reims-vgpu-vulkan" }
# Guest address resolution above the wire page-table format: span walks, GPA
# run coalescing, window region planning. `no_std` + alloc, no host traits.
reims-vgpu-paging = { path = "../reims-vgpu-paging" }
winit = { version = "0.30", optional = true }
ash-window = { version = "0.13", optional = true }
raw-window-handle = { version = "0.6", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
# Legacy translator-oracle integration fixtures; production translation is
# owned exclusively by `reims-vgpu-vulkan`.
metal2vulkan = { git = "https://github.com/steelbrain/metal2vulkan.git", rev = "9ff250502cd7ae8c6e0fab0b373b88d254d46170" }
# Reads `reims-vgpu-wire`'s oracle fixtures — bytes Apple's own serializer
# produced — so `wire_fixtures_reach_the_decoders` can run them through this
# crate's decoders. Test-only: nothing here reaches the staticlib QEMU links.
serde_json = "1"
reims-vgpu-vulkan = { path = "../reims-vgpu-vulkan", features = ["test-fixtures"] }
reims-vgpu-observe = { path = "../reims-vgpu-observe", features = ["test-fixtures"] }
reims-vgpu-memory = { path = "../reims-vgpu-memory", features = ["test-fixtures"] }
reims-vgpu-core = { path = "../reims-vgpu-core", features = ["test-fixtures"] }

[build-dependencies]
cc = "1"

# Standalone visual smoke test for the host-owned window (needs a display + the
# windowing stack); built only when the host-window feature is on.
[[example]]
name = "host_window_smoke"
required-features = ["host-window"]
