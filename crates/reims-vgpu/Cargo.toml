[package]
name = "reims-vgpu"
description = "The public Rust API of the reims virtual GPU"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = ["macos-sdl"]
# SDL3's window on macOS, the window crate's `macos-sdl`, which `REIMS_VGPU_WINDOW_IMPL=sdl` opens
# in place of AppKit's. Without it the macOS library has no SDL, and its windows are AppKit's.
# Linux's and Windows's window is SDL3's whatever this says.
macos-sdl = ["reims-vgpu-window/macos-sdl"]
# Tests: the core objects behind the public handles (`core()`), and core's testkit.
testkit = ["reims-vgpu-vulkan/testkit"]
# Kept for the builds that name it (`--features vulkan`): the Vulkan platform is the library's only
# one, everywhere, so the feature changes nothing.
vulkan = []

[dependencies]
reims-vgpu-window.workspace = true
# The reims-graphics device's host video: its runtime, which the video arms run on (`video`), and
# on Linux the arms' VA-API and NVDEC (`graphics::vaapi`, `graphics::nvidia`).
reims-vgpu-video.workspace = true
# The reims-graphics device's host side (`graphics`).
reims-vgpu-graphics.workspace = true
# Reads the reims-graphics device's wire messages into their records (`graphics::decode`).
zerocopy.workspace = true
# A library's content key, by which the reims-graphics device keeps the libraries it made
# (`graphics::decode::library`).
sha2.workspace = true
# A window frame that fails, or a window that gets no sink (`graphics::sink`).
log.workspace = true
# The reims-graphics decoder's lock, which a doorbell's thread takes and its queue's service thread
# lets go (`graphics`'s take on a doorbell): `arc_lock`'s owned guard, and `send_guard`, which lets
# it cross threads.
parking_lot = { workspace = true, features = ["arc_lock", "send_guard"] }

# The Vulkan platform (architecture 2.2), the library's only one: natively on Linux and Windows,
# and on macOS over Mesa's KosmicKrisp where the distribution ships it (`os/macos/rt_driver.rs`).
reims-vgpu-vulkan.workspace = true
# The platform's runtime, metal2vulkan-runtime: the pool's block source over it (`pool::rt_blocks`).
metal2vulkan-runtime.workspace = true

# On Windows, a file's ID and times, which name the library's build (`graphics/answers/windows.rs`),
# and the lines a fault writes (`faults.rs`): its exception handler, the loader's and the unwind's
# queries, the thread's name and stderr.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }

[dev-dependencies]
reims-vgpu-vulkan = { workspace = true, features = ["testkit"] }
# A test's window, which makes the Vulkan surfaces asked of it (`graphics::rt_window`'s tests).
ash.workspace = true
# The tests' host calls: on Linux the guest's RAM as a host maps it (`platform::tests`), whether a
# page is mapped, and the cost measurements' clocks and threads.
libc.workspace = true

# On Windows, the tests' host calls: a page's state, a pagefile section for the guest's RAM, and
# the cost measurements' clocks.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

# The decoder's tests of Metal's own stitched functions (`graphics::decode`); `entry`'s tests read
# retain counts with `objc2`.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2.workspace = true
objc2-foundation.workspace = true
objc2-metal.workspace = true

[lints]
workspace = true
