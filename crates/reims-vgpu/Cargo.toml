[package]
name = "reims-vgpu"
description = "The public Rust API of the reims virtual GPU"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = ["macos-sdl"]
# SDL3's window on macOS, the window crate's `macos-sdl`, which `REIMS_VGPU_WINDOW_IMPL=sdl` opens
# in place of AppKit's. Without it the macOS library has no SDL, and its windows are AppKit's.
# Linux's window is SDL3's whatever this says.
macos-sdl = ["reims-vgpu-window/macos-sdl"]
# Tests: the core objects behind the public handles (`core()`), and core's testkit.
testkit = ["reims-vgpu-core/testkit"]
# The Vulkan platform (architecture 2.2) on macOS: `VulkanPlatform` as an `ApiPlatform`, on
# MoltenVK, which the C API's own `vulkan` feature makes its platform. Off by default, as the Metal
# platform is the product there. On Linux the Vulkan platform is the library's only one, its
# dependencies are not optional, and the feature changes nothing (`build.rs`).
vulkan = [
    "dep:reims-vgpu-vulkan",
    "dep:reims-vgpu-video-vulkan",
    "dep:metal2vulkan-runtime",
    "dep:ash",
]

[dependencies]
reims-vgpu-core.workspace = true
reims-vgpu-window.workspace = true
# The video crates' runtime, which the reims-graphics device's video arms run on (`video`).
reims-vgpu-video-core.workspace = true
# The reims-graphics device's host side (`graphics`).
reims-graphics.workspace = true
# Reads the reims-graphics device's wire messages into their records (`graphics::decode`).
zerocopy.workspace = true
# A library's content key, by which the reims-graphics device keeps the libraries it made
# (`graphics::decode::library`).
sha2.workspace = true
# A window frame that fails, or a window that gets no sink (`graphics::sink`).
log.workspace = true
# The reims-graphics decoder's lock, which a doorbell's thread takes and its queue's service thread
# lets go (`graphics`'s take on a doorbell): `arc_lock`'s owned guard, and `send_guard`, which lets
# it cross threads.
parking_lot = { workspace = true, features = ["arc_lock", "send_guard"] }
# The host's page size, which the window's import of the scanout's pages is aligned to
# (`graphics::sink`); on Linux, the guest's RAM as a host maps it in the tests (`platform::tests`).
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# The Vulkan platform, the library's only one on Linux: the dependencies of the `vulkan` feature,
# which on macOS are optional (below).
reims-vgpu-vulkan.workspace = true
# The reims-graphics device's hardware video on the Vulkan platform (`graphics::vulkan::video`):
# Vulkan Video's decoders, on the runtime's device and its video-decode queue, through ash.
reims-vgpu-video-vulkan.workspace = true
metal2vulkan-runtime.workspace = true
ash.workspace = true
# The reims-graphics device's hardware video on NVIDIA's NVDEC, whose libraries it loads at run
# time (`graphics::nvidia`).
reims-vgpu-video-nvidia.workspace = true

# The Metal platform, the product on macOS, and its window's drawable (`graphics::metal`,
# `graphics::vulkan`'s macOS sink).
[target.'cfg(target_os = "macos")'.dependencies]
reims-vgpu-metal.workspace = true
objc2.workspace = true
objc2-metal.workspace = true
objc2-quartz-core = { workspace = true, features = ["CAMetalLayer", "objc2-metal"] }
# The Vulkan platform on MoltenVK, with the `vulkan` feature: the dependencies Linux always has
# (above).
reims-vgpu-vulkan = { workspace = true, optional = true }
reims-vgpu-video-vulkan = { workspace = true, optional = true }
metal2vulkan-runtime = { workspace = true, optional = true }
ash = { workspace = true, optional = true }

[dev-dependencies]
reims-vgpu-core = { workspace = true, features = ["testkit"] }

# The decoder's tests of Metal's own stitched functions and arrays (`graphics::decode`).
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-foundation.workspace = true

[lints]
workspace = true
