# reims-ctl: creates, boots and manages macOS VMs on QEMU with reims-vgpu (README.md). It links
# nothing of the library: it runs the QEMU that scripts/install-ctl.sh builds on it, with the
# option ROM and guest kexts it carries (src/prebuilt.rs). Its own workspace, so it builds
# without the rest of the tree (or the metal2vulkan the library's workspace fetches).
[package]
name = "reims-ctl"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false
license = "GPL-2.0-or-later OR LGPL-3.0-or-later"
description = "Create, boot and manage macOS VMs on QEMU with reims-vgpu"

[workspace]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
crc32fast = "1.5.2"
flate2 = "1.1.10"
libc = "0.2.190"
# An x86-64 VM's OpenCore config.plist, for the Mac it presents (opencore.rs).
plist = "1.10.1"
# The viewer's frames for the kitty and iTerm2 image protocols (view/encode.rs).
png = "0.18.1"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.153"
shlex = "2.0.1"
toml = "1.1.2"

[build-dependencies]
# Reads guest/prebuilt/set.toml, the guest's kexts build.rs embeds.
toml = "1.1.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Lists the host's Vulkan GPUs; `loaded` opens the Vulkan loader at run time, so the binary
# needs no Vulkan to start.
ash = { version = "0.38", default-features = false, features = ["std", "loaded"] }

[profile.release]
debug = "line-tables-only"
