[package]
name = "reims-vgpu-window"
description = "A guest display's own window: on macOS AppKit (or SDL3) and a CAMetalLayer, on Linux and Windows SDL3 and Vulkan; input and the host's screens"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
log.workspace = true
# ash's Vulkan types for a window's surface (`present`): SDL's on Linux and Windows, the layer's
# on macOS.
ash.workspace = true
# The Vulkan crate: core's threads and holds (`reims_vgpu_vulkan::core`), and its OS layer: its
# threads, and on macOS its clock and the message layer the AppKit side sends through
# (`reims_vgpu_vulkan::os`).
reims-vgpu-vulkan.workspace = true

# The window on Linux and Windows (`sdl`): SDL3 for the window, its input and its Vulkan surface.
[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
sdl3-sys.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# libwayland-client's calls, looked up in the library SDL opened (`native/linux/feedback.rs`).
libc.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
# The shell's full-screen mark of a borderless window (`native/windows.rs`): COM, and the taskbar
# list's class ID.
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }

[features]
default = ["macos-sdl"]
# SDL's library left unbuilt and unlinked: for a check of the Linux or Windows target on another
# OS, which compiles but never links (`cargo xtask check`'s clippy of the Linux target on a Mac).
sdl-no-link = ["sdl3-sys?/no-link"]
# SDL3's window on macOS (`sdl`, `native/macos/sdl.rs`), which `REIMS_VGPU_WINDOW_IMPL=sdl` opens
# in place of AppKit's. `cargo xtask dist` keeps SDL's symbols out of the archive's globals and
# gives its Objective-C classes the library's own names (xtask/src/dist/macos.rs), so a host's
# own SDL never binds to them. Without the feature the macOS build has no SDL, and its windows
# are AppKit's: `reims-vgpu` and `reims-vgpu-c` forward it as their default, so
# `cargo build -p reims-vgpu-c --no-default-features` builds the library without SDL.
macos-sdl = ["dep:sdl3-sys"]

# The window's AppKit side (`native/macos.rs`): AppKit, Core Animation, CoreGraphics and Carbon.
[target.'cfg(target_os = "macos")'.dependencies]
sdl3-sys = { workspace = true, optional = true }
libc.workspace = true
objc2.workspace = true
objc2-foundation.workspace = true
objc2-metal.workspace = true
block2.workspace = true
objc2-core-foundation = { workspace = true, features = [
    "CFArray",
    "CFCGTypes",
    "CFDictionary",
    "CFNumber",
    "CFRunLoop",
    "block2",
    "objc2",
] }
objc2-core-graphics = { workspace = true, features = [
    "CGColor",
    "CGColorSpace",
    "CGDirectDisplay",
    "CGDisplayConfiguration",
    "CGError",
    "CGEvent",
    "CGEventTypes",
    "CGGeometry",
    "CGRemoteOperation",
    "objc2",
] }
objc2-quartz-core = { workspace = true, features = [
    "CALayer",
    "CAMediaTiming",
    "CAMetalLayer",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-metal",
] }
objc2-app-kit = { workspace = true, features = [
    "NSAlert",
    "NSApplication",
    "NSBitmapImageRep",
    "NSButton",
    "NSColor",
    "NSColorSpace",
    "NSControl",
    "NSCursor",
    "NSEvent",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSTrackingArea",
    "NSUserInterfaceItemIdentification",
    "NSView",
    "NSWindow",
    "block2",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-quartz-core",
] }

[dev-dependencies]
reims-vgpu-vulkan = { workspace = true, features = ["testkit"] }

[lints]
workspace = true
