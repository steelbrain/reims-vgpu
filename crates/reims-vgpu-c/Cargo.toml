[package]
name = "reims-vgpu-c"
description = "The C API (rvg_*) of the reims-graphics device over reims-vgpu; adds no behaviour"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
# cdylib: the dist tree's lib/libreims_vgpu.dylib (@rpath/libreims_vgpu.dylib), which the C
# harness links; staticlib: lib/libreims_vgpu.a, which QEMU links; rlib so Rust tests link it.
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["macos-sdl"]
# SDL3's window on macOS (`reims-vgpu`'s `macos-sdl`), on by default: `--no-default-features`
# builds the macOS library without SDL, its windows AppKit's alone.
macos-sdl = ["reims-vgpu/macos-sdl"]
# Kept for the builds that name it (`--features vulkan`): every handle is made on `VulkanPlatform`
# with or without it (`Plat`, `lib.rs`).
vulkan = ["reims-vgpu/vulkan"]

[dependencies]
reims-vgpu.workspace = true
# The graphics device's wire constants, which the C API's PCI constants are checked against.
reims-vgpu-graphics.workspace = true
# The death of a NULL handle, and the mark of the library's threads (the unit tests' testkit
# platform stands where VulkanPlatform stands in the product).
reims-vgpu-vulkan.workspace = true
# A refusal of a memory map's files.
log.workspace = true
# `fstat` and the host's page size, for the files behind a memory map's ranges.
libc.workspace = true

[target.'cfg(any(all(target_os = "linux", target_arch = "x86_64"), all(target_os = "macos", target_arch = "aarch64")))'.dependencies]
# The library's global allocator on the two targets that ship (lib.rs).
tikv-jemallocator.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# `exception::catch` around every call of a host function (`ffi::host_call`, `ffi/catch/macos.rs`).
objc2.workspace = true

[dev-dependencies]
reims-vgpu = { workspace = true, features = ["testkit"] }
reims-vgpu-vulkan = { workspace = true, features = ["testkit"] }
# The window tests' recorder.
parking_lot.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
# The exceptions `ffi`'s tests throw as a host would (`ffi/tests/macos.rs`).
objc2-foundation.workspace = true

[lints]
workspace = true
